name: Set up places and indexes

# Run once (Actions → Set up places and indexes → Run workflow), then again after an update that adds
# indexes, or yearly to refresh the places. It creates the database indexes (npm run db:setup) and loads
# GeoNames' cities and towns for the city search and "Use my location" (crawler/load_places.py).
on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # creating indexes needs a user allowed to; falls back to the crawler's if there's no admin secret
      MONGODB_URI: ${{ secrets.MONGODB_ADMIN_URI || secrets.MONGODB_CRAWLER_URI }}
      MONGODB_DB: ${{ vars.MONGODB_DB || 'wpg_events' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1" # the test database isn't needed here
      - name: Create the database indexes
        run: npm run db:setup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt
      - name: Load GeoNames' cities and towns
        run: python crawler/load_places.py
