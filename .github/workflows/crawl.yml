name: Crawl events

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC), off the hour when GitHub's scheduler is busiest
  workflow_dispatch: {} # "Run workflow" button, and the hook for an on-demand refresh later

concurrency:
  group: crawl
  cancel-in-progress: false # never two crawls at once

jobs:
  # the cities to crawl: every one in shared/cities.json
  cities:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(jq -c 'keys_unsorted' shared/cities.json)" >> "$GITHUB_OUTPUT"

  crawl:
    needs: cities
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one city's failing source doesn't stop the other cities
      max-parallel: 2  # cities share sources (Eventbrite, AllEvents); go easy on them
      matrix:
        city: ${{ fromJSON(needs.cities.outputs.list) }}
    name: crawl ${{ matrix.city }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - run: pip install -r crawler/requirements.txt

      # Fails the job (and GitHub emails you) when a source that returned events last run
      # returns none (exit 2), or a run finds under half the city's usual events (exit 3).
      - name: Crawl and load into MongoDB
        run: python crawler/load_to_mongo.py --city "${{ matrix.city }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_CRAWLER_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'wpg_events' }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          # use the pip `tzdata` package's rules, not the runner's: Manitoba stopped changing
          # clocks in Nov 2026 and an older system database would shift times by an hour
          PYTHONTZPATH: ""
