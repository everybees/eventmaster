[build]
  command = "npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # mongodb-memory-server is only for tests; don't download a 140 MB MongoDB binary on every build
  MONGOMS_DISABLE_POSTINSTALL = "1"
  # MONGODB_DB is just the database name ("wpg_events", also the code's default), not a secret;
  # without this, Netlify's secrets scan fails the build on finding that name in the code.
  # MONGODB_URI stays scanned: its value must never appear in the repo.
  SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB"

[functions]
  node_bundler = "esbuild"

# `npm run dev` → netlify dev: the Vite app plus the functions on http://localhost:8888
[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Netlify Image CDN may fetch, resize and cache images from these hosts only
# (the sources' image hosts; add one when a new source arrives).
[images]
  remote_images = [
    "https://img\\.evbuc\\.com/.*",
    "https://cdn\\.evbuc\\.com/.*",
    "https://cdn-ip\\.allevents\\.in/.*",
    "https://cdn-az\\.allevents\\.in/.*",
    "https://www\\.tourismwinnipeg\\.com/.*",
    "https://www\\.cinemaclock\\.com/.*",
    "https://winnipegfilmgroup\\.com/.*",
    "https://s1\\.ticketm\\.net/.*",
    "https://silverbirdcinemas\\.com/.*",
  ]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
